# configuração da plataforma (plataforma/__main__.py)

servidor:
  host: localhost
  porta: 2000
  timeout_s: 30.0         # rpc do carla e espera dos dados de cada frame

mundo:
  mapa: Town04            # provisório
  dt: 0.05                # fixed_delta_seconds, 1/30 1/20 testar

ego:
  blueprint: vehicle.lincoln.mkz_2020   # provisório
  ponto_spawn: 0

laco:
  duracao_s: 0            # 0 s= até ctrl+c ou esc
  watchdog_s: 0.1         # entrada mais velha que isso: acelerador zero e freio
  margem_s: 0.001         # sleep grosso até essa margem antes do deadline, depois espera ativa

camera:
  largura: 960
  altura: 540
  vista: atras             
  vistas:
    atras:                  
      x: -5.0
      y: 0.0
      z: 2.0
      pitch: -10.0
      fixacao: SpringArmGhost
    cockpit:                
      x: 0.2
      y: -0.35
      z: 1.25
      pitch: 0.0
      fixacao: Rigid
registro:
  pasta: logs
